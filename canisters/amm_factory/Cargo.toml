[package]
name = "amm_factory"
version = "0.1.0"
edition = "2021"

[dependencies]
ic-cdk = "0.13"
ic-cdk-macros = "0.13"
ics = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candid = "0.10"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "amm_factory"
path = "src/main.rs"
