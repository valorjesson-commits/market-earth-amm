name: Market Earth AMM CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Run unit tests
        run: cargo test --workspace

  local-integration:
    needs: rust-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install DFX
        run: |
          DFX_VERSION=0.32.0
          SF_URL="https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz"
          curl -L "$SF_URL" -o dfx.tar.gz
          tar -xzf dfx.tar.gz

          mkdir -p $HOME/.local/share/dfx/bin
          mv dfx $HOME/.local/share/dfx/bin/
          chmod +x $HOME/.local/share/dfx/bin/dfx

          echo "$HOME/.local/share/dfx/bin" >> $GITHUB_PATH

      - name: Run deployment and integration checks
        run: |
          export PATH="$HOME/.local/share/dfx/bin:$PATH"
          dfx --version
          chmod +x deploy_local.sh scripts/integration_liquidity_test.sh

          GOV_PRINCIPAL="$(dfx identity get-principal)" ./deploy_local.sh
          ./scripts/integration_liquidity_test.sh

      - name: Cleanup replica on failure
        if: failure()
        run: |
          export PATH="$HOME/.local/share/dfx/bin:$PATH"
          dfx stop || true
