name: CI Integration & Liquidity Pipeline
on:
  push:
    branches: [ "main", "amm-deploy-setup" ]
  pull_request:
    branches: [ "main" ]
jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - run: DFX_VERSION=0.15.2 sh -ci "$(curl -fsSL https://internetcomputer.org/install.sh)" && echo "$HOME/.local/share/dfx/bin" >> $GITHUB_PATH
      - env:
          GOV_PRINCIPAL: ${{ secrets.GOV_PRINCIPAL }}
        run: |
          chmod +x deploy_local.sh
          GOV_PRINCIPAL="${GOV_PRINCIPAL:-$(dfx identity get-principal)}" ./deploy_local.sh
      - run: chmod +x scripts/integration_liquidity_test.sh && ./scripts/integration_liquidity_test.sh
      - if: always()
        run: dfx stop || true
